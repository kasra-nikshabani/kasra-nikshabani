      <text class="mL" x="220" y="166" font-size="11" fill="#7c8aa5" text-anchor="end">0.2%</text>
    </g>
    <g>
      <circle cx="253" cy="162" r="4.5" fill="#b07219"/>
      <text class="mL" x="266" y="166" font-size="12" fill="#dbe4f0">Java</text>
      <text class="mL" x="444" y="166" font-size="11" fill="#7c8aa5" text-anchor="end">0.1%</text>
