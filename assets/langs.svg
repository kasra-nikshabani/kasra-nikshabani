      <rect x="444.9" y="76" width="1.5" height="12" fill="#f1e05a">
        <animate attributeName="width" from="0" to="1.5" dur=".8s" begin="0.32s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
