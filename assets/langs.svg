      </rect>
      <rect x="239.3" y="76" width="114.9" height="12" fill="#3572A5">
        <animate attributeName="width" from="0" to="114.9" dur=".8s" begin="0.08s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      </rect>
      <rect x="354.2" y="76" width="84.8" height="12" fill="#3178c6">
