      <text class="mL" x="42" y="144" font-size="12" fill="#dbe4f0">TypeScript</text>
      <text class="mL" x="220" y="144" font-size="11" fill="#7c8aa5" text-anchor="end">20.1%</text>
    </g>
    <g>
      <circle cx="253" cy="140" r="4.5" fill="#663399"/>
      <text class="mL" x="266" y="144" font-size="12" fill="#dbe4f0">CSS</text>
      <text class="mL" x="444" y="144" font-size="11" fill="#7c8aa5" text-anchor="end">1.4%</text>
    </g>
