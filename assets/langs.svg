<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 210" width="470" height="210" role="img" aria-label="◆ Most Used Languages">
  <title>◆ Most Used Languages</title>
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="45%" stop-color="#0d1226"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="acL" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="470" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="rlL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grL" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#93c5fd" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="cdL"><rect width="470" height="210" rx="14"/></clipPath>
    <style>
      .sL { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mL { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>
  <g clip-path="url(#cdL)">
    <rect width="470" height="210" fill="url(#bgL)"/>
    <rect width="470" height="210" fill="url(#grL)"/>
    <text class="sL" x="24" y="40" font-size="16" font-weight="700" fill="url(#acL)">◆ Most Used Languages</text>
    <rect x="24" y="54" width="422" height="1.5" rx="1" fill="url(#rlL)"/>
    <clipPath id="barL"><rect x="24" y="76" width="422" height="12" rx="6"/></clipPath>
    <rect x="24" y="76" width="422" height="12" rx="6" fill="#ffffff" fill-opacity=".05"/>
    <g clip-path="url(#barL)">
