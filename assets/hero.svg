<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Kasra Nikshabani — Full-Stack Developer">
  <title>Kasra Nikshabani — Full-Stack Developer</title>

  <defs>
    <!-- background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#05070f"/>
      <stop offset="45%"  stop-color="#0d1226"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>

    <!-- animated accent gradient for the name -->
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="560" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="50%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
      <animate attributeName="x1" values="40;-360;40"  dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="560;960;560" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#818cf8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- grid -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#93c5fd" stroke-opacity=".07" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="textGlow" x="-30%" y="-60%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card"><rect width="1000" height="280" rx="18"/></clipPath>

    <!-- typewriter masks -->
    <clipPath id="t1"><rect x="48" y="176" height="26" width="0">
      <animate attributeName="width" values="0;446;446;0;0" keyTimes="0;0.1333;0.3;0.3083;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="48" y="176" height="26" width="0">
      <animate attributeName="width" values="0;0;399;399;0;0" keyTimes="0;0.3333;0.4667;0.6333;0.6417;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t3"><rect x="48" y="176" height="26" width="0">
      <animate attributeName="width" values="0;0;317;317;0;0" keyTimes="0;0.6667;0.8;0.9667;0.975;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>

    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      .float { animation: float 9s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- ambient light -->
    <g filter="url(#soft)">
      <circle cx="180" cy="70" r="120" fill="url(#glowA)">
        <animate attributeName="cx" values="180;300;180" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="820" cy="220" r="140" fill="url(#glowB)">
        <animate attributeName="cy" values="220;120;220" dur="17s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- window chrome -->
    <g>
      <circle cx="42" cy="34" r="6" fill="#ff5f57"/>
      <circle cx="62" cy="34" r="6" fill="#febc2e"/>
      <circle cx="82" cy="34" r="6" fill="#28c840"/>
      <text class="mono" x="118" y="39" font-size="12" fill="#5b6b85">~/kasra — zsh</text>
    </g>
    <rect x="0" y="58" width="1000" height="1" fill="#ffffff" fill-opacity=".07"/>

    <!-- name -->
    <text class="sans" x="46" y="132" font-size="56" font-weight="800" letter-spacing="1"
          fill="url(#accent)" filter="url(#textGlow)">KASRA</text>

    <!-- prompt -->
    <g class="mono" font-size="19">
      <text x="48" y="164" fill="#4b5b75">
        <tspan fill="#22d3ee">❯</tspan><tspan dx="10" fill="#5b6b85">whoami</tspan>
      </text>

      <!-- line 1 -->
      <g>
        <g clip-path="url(#t1)">
          <text x="48" y="196" fill="#dbe4f0" textLength="440" lengthAdjust="spacingAndGlyphs">Full-Stack Developer · Node.js &amp; React</text>
        </g>
        <g>
          <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.3;0.3083;0.99;1" dur="12s" repeatCount="indefinite"/>
          <rect class="blink" y="178" width="10" height="22" fill="#22d3ee" x="48">
            <animate attributeName="x" values="48;494;494;48;48" keyTimes="0;0.1333;0.3;0.3083;1" dur="12s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>

      <!-- line 2 -->
      <g clip-path="url(#t2)">
        <text x="48" y="196" fill="#dbe4f0" textLength="393" lengthAdjust="spacingAndGlyphs">Backend Engineering with Go &amp; Java</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3334;0.6333;0.6417;1" dur="12s" repeatCount="indefinite"/>
        <rect class="blink" y="178" width="10" height="22" fill="#818cf8" x="48">
          <animate attributeName="x" values="48;48;447;447;48;48" keyTimes="0;0.3333;0.4667;0.6333;0.6417;1" dur="12s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- line 3 -->
      <g clip-path="url(#t3)">
        <text x="48" y="196" fill="#dbe4f0" textLength="311" lengthAdjust="spacingAndGlyphs">Building things that scale.</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6668;0.9667;0.975;1" dur="12s" repeatCount="indefinite"/>
        <rect class="blink" y="178" width="10" height="22" fill="#f472b6" x="48">
          <animate attributeName="x" values="48;48;365;365;48;48" keyTimes="0;0.6667;0.8;0.9667;0.975;1" dur="12s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- capability pills -->
    <g class="mono" font-size="12">
      <g>
        <rect x="48"  y="214" width="88" height="28" rx="14" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".35"/>
        <text x="92"  y="232" fill="#7dd3fc" text-anchor="middle">Backend</text>
      </g>
      <g>
        <rect x="146" y="214" width="92" height="28" rx="14" fill="#818cf8" fill-opacity=".08" stroke="#818cf8" stroke-opacity=".35"/>
        <text x="192" y="232" fill="#a5b4fc" text-anchor="middle">Frontend</text>
      </g>
      <g>
        <rect x="248" y="214" width="84" height="28" rx="14" fill="#f472b6" fill-opacity=".08" stroke="#f472b6" stroke-opacity=".35"/>
        <text x="290" y="232" fill="#f9a8d4" text-anchor="middle">Node.js</text>
      </g>
      <g>
        <rect x="342" y="214" width="84" height="28" rx="14" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-opacity=".35"/>
        <text x="384" y="232" fill="#6ee7b7" text-anchor="middle">React</text>
      </g>
      <g>
        <rect x="436" y="214" width="76" height="28" rx="14" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-opacity=".35"/>
        <text x="474" y="232" fill="#fcd34d" text-anchor="middle">Go</text>
      </g>
    </g>

    <!-- orbital emblem -->
    <g transform="translate(848 140)">
    <g class="float">
      <circle r="78" fill="none" stroke="#818cf8" stroke-opacity=".22" stroke-width="1.5"
              stroke-dasharray="8 12" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="58" fill="none" stroke="#22d3ee" stroke-opacity=".16" stroke-width="1"/>
      <circle r="38" fill="#0b1020" stroke="#ffffff" stroke-opacity=".08"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="16s" repeatCount="indefinite"/>
        <circle cx="78"  cy="0" r="4.5" fill="#22d3ee"/>
        <circle cx="-39" cy="67" r="4.5" fill="#f472b6"/>
        <circle cx="-39" cy="-67" r="4.5" fill="#34d399"/>
      </g>

      <text class="mono" y="9" font-size="26" font-weight="700" fill="#7dd3fc" text-anchor="middle">&lt;/&gt;</text>
    </g>
    </g>

    <!-- bottom rule -->
    <rect x="0" y="278" width="1000" height="2" fill="url(#rule)"/>
  </g>
  <rect x=".5" y=".5" width="999" height="279" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".10"/>
</svg>
